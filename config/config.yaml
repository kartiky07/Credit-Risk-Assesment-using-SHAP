data:
  raw_path: "credit_risk_dataset.csv"
  processed_dir: "data/processed"
  train_path: "data/processed/train.parquet"
  test_path: "data/processed/test.parquet"
  test_size: 0.2
  random_state: 42
  target_col: "loan_status"

validation:
  min_age: 18
  max_age: 100
  max_emp_length: 60
  min_loan_amnt: 0

features:
  numeric_cols:
    - person_age
    - person_income
    - person_emp_length
    - loan_amnt
    - loan_int_rate
    - loan_percent_income
    - cb_person_cred_hist_length
  categorical_cols:
    - person_home_ownership
    - loan_intent
    - loan_grade
    - cb_person_default_on_file

model:
  name: "XGBoost_Calibrated"
  learning_rate: 0.1
  random_state: 42
  calibration_method: "sigmoid"
  calibration_cv: 5
  n_estimators: 300
  max_depth: 5

mlflow:
  experiment_name: "credit-risk-assessment"
  tracking_uri: "sqlite:///mlflow.db"

artifacts:
  models_dir: "models"
  model_path: "credit_risk_model.pkl"
  threshold_path: "best_threshold.pkl"
  explainer_path: "models/shap_explainer.pkl"
  metrics_path: "models/metrics.json"
